name: lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n bin/xlin lib/hyprland.sh lib/config-backups.sh install.sh update.sh scripts/files.sh scripts/deps.sh bin/xlin-dock-watch config/shell/xlin.bash tests/test-hyprland.sh tests/test-config-backups.sh tests/test-process-ownership.sh
      - name: ShellCheck (errors only)
        run: sudo apt-get install -y shellcheck && shellcheck -S error bin/xlin lib/hyprland.sh lib/config-backups.sh install.sh update.sh tests/test-hyprland.sh tests/test-config-backups.sh tests/test-process-ownership.sh
      - name: Hyprland helper regression tests
        run: bash tests/test-hyprland.sh
      - name: Config backup regression tests
        run: bash tests/test-config-backups.sh
      - name: Process ownership regression tests
        run: bash tests/test-process-ownership.sh
      - name: No duplicated functions in bin/xlin
        run: test -z "$(grep -oE '^[a-z_]+\(\)' bin/xlin | sort | uniq -d)"
      - name: Install list consistency
        run: bash tests/test-install-lists.sh
      - name: Default pins regression tests
        run: bash tests/test-pins.sh
      - name: Desktop folders and widget transparency
        run: python3 tests/test-desktop-folders.py
      - name: Default apps and settings pages
        run: bash tests/test-defaults.sh
      - name: Update mode and scroll bar
        run: bash tests/test-update-mode.sh
      - name: Scrolling
        run: bash tests/test-scroll.sh
      - name: Brightness floor and mute
        run: bash tests/test-brightness.sh
      - name: Hide and restore windows
        run: bash tests/test-hide.sh
      - name: Apps keep a clean environment
        run: bash tests/test-launch-env.sh
      - name: Status bar, volume menu, Run Bar
        run: bash tests/test-bars.sh
      - name: Reset and menu commands
        run: bash tests/test-reset.sh
      - name: Fix
        run: bash tests/test-fix.sh
      - name: Smoke-run every app (stubbed GTK)
        run: bash tests/test-smoke.sh
      - name: Xedit and Xview
        run: bash tests/test-apps.sh
      - name: Media, Manual, Welcome
        run: bash tests/test-media.sh
      - name: Wallpapers
        run: bash tests/test-wallpapers.sh
      - name: Menus and manual
        run: bash tests/test-menus.sh
      - name: Python compile
        run: python3 -m py_compile tests/smoke/gtk_stub.py bin/xlin-settings bin/xlin-tools bin/xlin-files bin/xlin-welcome bin/xlin-monitor bin/xlin-terminal bin/xlin-desktop bin/xlin-store bin/xlin-media bin/xlin-debug bin/xlin-edit bin/xlin-view bin/xlin-read bin/xlin-start lib/xlin_ui.py scripts/make-cursors.py scripts/make-icons.py scripts/make-wallpapers.py
